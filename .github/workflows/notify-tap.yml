name: Notify tap

# Tells adrianmross/homebrew-tap to bump this tool's formula as soon as a release is
# published, instead of waiting for the tap's 6h poll.
#
# Deliberately its OWN workflow rather than a step inside the release job: the cargo-dist
# repos have a generated release.yml that `dist generate` rewrites wholesale, so an edit
# there would be silently reverted the next time anyone regenerates. This file is not
# generated by anything, and the same shape works for the GoReleaser repos too.
#
# The tap does the actual rewriting. This only pokes it, so there is nothing to keep in
# sync as formulae change, and the 6h poll remains the backstop if this ever fails.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # A workflow's own GITHUB_TOKEN cannot reach another repository. This mints a
      # short-lived installation token from the adrianmross-tap-publisher App, scoped to
      # the tap alone, rather than parking a long-lived PAT in every tool repo.
      - name: Mint tap token
        id: tap_token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: adrianmross
          repositories: homebrew-tap

      - name: Dispatch formula bump
        env:
          GH_TOKEN: ${{ steps.tap_token.outputs.token }}
        run: |
          set -euo pipefail
          gh api --method POST /repos/adrianmross/homebrew-tap/dispatches \
            -f event_type=formula-bump \
            -F "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
